name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  set-timestamp:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
    steps:
      - name: Get timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

  build-and-push:
    runs-on: ubuntu-latest
    needs: set-timestamp
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      # 1. Setup QEMU (Required for ARM64 emulation)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 2. Setup Buildx (The magic engine)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Modify Dockerfile (Your 'sed' commands)
      # We do this BEFORE the build, so Buildx sees the clean version.
      - name: Prepare Dockerfile for production
        run: |
          sed -i '/# --- For Local Testing Only ---/d' Dockerfile
          sed -i '/COPY downloads\/ \.\/downloads\//d' Dockerfile

      # 4. Atomic Multi-Arch Build & Push
      # This replaces the entire 'matrix' and 'manifest create' jobs.
      - name: Build and push Multi-Arch Image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Build both architectures in one pass
          platforms: linux/amd64,linux/arm64
          push: true
          # Create both the timestamped tag AND 'latest' automatically
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.set-timestamp.outputs.timestamp }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
