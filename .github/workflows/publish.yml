name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  set-timestamp:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.timestamp.outputs.timestamp }}
    steps:
      - name: Get timestamp
        id: timestamp
        run: echo "timestamp=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

  build-and-push-arch:
    runs-on: ubuntu-latest
    needs: set-timestamp
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Dockerfile for production
        run: |
          sed -i '/# --- For Local Testing Only ---/d' Dockerfile
          sed -i '/COPY downloads\/ \.\/downloads\//d' Dockerfile

      - name: Get architecture from platform
        id: arch
        run: echo "arch=$(echo ${{ matrix.platform }} | cut -d'/' -f2)" >> $GITHUB_OUTPUT

      # --- CRITICAL FIX IS HERE ---
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # This creates your explicit tags: 20260129-amd64, 20260129-arm64
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.set-timestamp.outputs.timestamp }}-${{ steps.arch.outputs.arch }}
          # 🚨 FIX: Forces a raw image so 'docker manifest create' works later
          provenance: false 

  create-and-push-manifest:
    runs-on: ubuntu-latest
    needs: [set-timestamp, build-and-push-arch]
    permissions:
      packages: write
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          # 1. Create the unified TIMESTAMP tag (e.g., :20260129)
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.set-timestamp.outputs.timestamp }} \
            --amend ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.set-timestamp.outputs.timestamp }}-amd64 \
            --amend ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.set-timestamp.outputs.timestamp }}-arm64
          
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.set-timestamp.outputs.timestamp }}

          # 2. Create the unified LATEST tag
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest \
            --amend ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.set-timestamp.outputs.timestamp }}-amd64 \
            --amend ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.set-timestamp.outputs.timestamp }}-arm64
          
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest
