name: Publish Docker Image to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Determine version
        id: get_version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT
          fi

  build-and-push-arch:
    runs-on: ubuntu-latest
    needs: prepare-version
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Dockerfile for production
        run: |
          sed -i '/# --- For Local Testing Only ---/d' Dockerfile
          sed -i '/COPY downloads\/ \.\/downloads\//d' Dockerfile

      - name: Get architecture from platform
        id: arch
        run: echo "arch=$(echo ${{ matrix.platform }} | cut -d'/' -f2)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.prepare-version.outputs.version }}-${{ steps.arch.outputs.arch }}
          provenance: false 

  create-and-push-manifest:
    runs-on: ubuntu-latest
    needs: [prepare-version, build-and-push-arch]
    permissions:
      packages: write
    steps:
      - name: Set lowercase image name
        run: echo "IMAGE_NAME_LC=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        run: |
          # 1. Create the unified VERSION tag
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.prepare-version.outputs.version }} \
            --amend ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.prepare-version.outputs.version }}-amd64 \
            --amend ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.prepare-version.outputs.version }}-arm64
          
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.prepare-version.outputs.version }}

          # 2. Create the unified LATEST tag
          docker manifest create ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest \
            --amend ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.prepare-version.outputs.version }}-amd64 \
            --amend ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ needs.prepare-version.outputs.version }}-arm64
          
          docker manifest push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:latest

  github-release:
    runs-on: ubuntu-latest
    needs: [create-and-push-manifest]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true